{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Login</title>
  <link rel="stylesheet" href="{% static 'blog/auth.css' %}">
</head>
<body>
  <div class="auth-box">
    <h2>Login</h2>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Login</button>
    </form>

    <p>Don’t have an account? <a href="{% url 'register' %}">Register</a></p>
  </div>
</body>
</html>
