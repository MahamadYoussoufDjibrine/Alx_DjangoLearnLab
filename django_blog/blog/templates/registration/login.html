{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="{% static 'blog/auth.css' %}">
</head>
<body>
  <div class="container">
    <h2>Login</h2>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Login</button>
    </form>

    <a class="small-link" href="{% url 'register' %}">Create an account</a>
  </div>
</body>
</html>
